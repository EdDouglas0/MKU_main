name: Ed CDCI

on:
  workflow_dispatch:
  schedule:
    - cron: "20,25,30 11,12,13 * * 1-5"   # Every weekday at 11:00 UTC

jobs:
  auto-run:
    runs-on: ubuntu-24.04

    steps:
      - name: Get repository code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Record artifact timestamp
        id: timestamp
        run: echo "value=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Run training experiments
        run: python model_training/train_experiments.py

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: best-regression-model-${{ steps.timestamp.outputs.value }}
          path: artifacts/best_model.joblib
          if-no-files-found: error