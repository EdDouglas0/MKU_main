name: Ed CDCI

on:
  workflow_dispatch:
  schedule:
    - cron: "50,55,01,06,11,16 13,14 * * 1-5" # Weekdays at these minutes during 13:00-14:59 UTC

jobs:
  auto-run:
    runs-on: ubuntu-24.04
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db

    steps:
      - name: Get repository code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record artifact timestamp
        id: timestamp
        run: echo "value=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Run training experiments
        run: python model_training/train_experiments.py

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: best-regression-model-${{ steps.timestamp.outputs.value }}
          path: artifacts/best_model.joblib
          if-no-files-found: error

      - name: Upload MLflow tracking data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs-${{ steps.timestamp.outputs.value }}
          path: |
            mlflow-ci.db
            mlartifacts/
          if-no-files-found: warn
